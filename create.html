<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Mentee - C2S Mentee Management</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="index.html" class="brand">
        <span class="brand-logo">C2</span>
        <span>C2S Mentee Management</span>
      </a>
    </div>
  </header>

  <main class="container">
    <div id="flashMessage"></div>

    <div class="page-header">
      <h1>Add Mentee</h1>
      <a href="index.html" class="btn btn-outline">&larr; Back to Dashboard</a>
    </div>

    <form class="form-card" id="menteeForm" novalidate>
      <h2>New Mentee</h2>
      <p class="subtitle">Fill in the mentee details below. Fields marked <span style="color:var(--danger)">*</span> are required.</p>

      <div class="form-grid">
        <div class="form-group full">
          <label for="name">Mentee Name <span class="req">*</span></label>
          <input type="text" id="name" name="name" placeholder="Full name" required>
        </div>

        <div class="form-group">
          <label for="status">Status</label>
          <select id="status" name="status">
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
            <option value="Transferred to Other Ministry">Transferred to Other Ministry</option>
          </select>
        </div>

        <div class="form-group">
          <label for="contact">Contact Number</label>
          <input type="text" id="contact" name="contact" placeholder="09&lowast;&lowast;&lowast;&lowast;&lowast;&lowast;&lowast;&lowast;&lowast;" inputmode="numeric">
        </div>

        <div class="form-group">
          <label for="birthday">Birthday</label>
          <input type="date" id="birthday" name="birthday">
        </div>

        <div class="form-group">
          <label for="age">Age</label>
          <input type="text" id="age" name="age" readonly placeholder="Auto-computed" disabled>
        </div>

        <div class="form-group full">
          <label for="address">Address</label>
          <input type="text" id="address" name="address" placeholder="Home address">
        </div>

        <div class="form-section">Training Progress</div>

        <div class="form-group">
          <label for="cldp1">CLDP 1</label>
          <select id="cldp1" name="cldp1">
            <option value="Unenrolled">Unenrolled</option>
            <option value="Ongoing">Ongoing</option>
            <option value="Incomplete">Incomplete</option>
            <option value="Completed">Completed</option>
          </select>
        </div>

        <div class="form-group">
          <label for="cldp2">CLDP 2</label>
          <select id="cldp2" name="cldp2">
            <option value="Unenrolled">Unenrolled</option>
            <option value="Ongoing">Ongoing</option>
            <option value="Incomplete">Incomplete</option>
            <option value="Completed">Completed</option>
          </select>
        </div>

        <div class="form-group">
          <label for="cldp3">CLDP 3</label>
          <select id="cldp3" name="cldp3">
            <option value="Unenrolled">Unenrolled</option>
            <option value="Ongoing">Ongoing</option>
            <option value="Incomplete">Incomplete</option>
            <option value="Completed">Completed</option>
          </select>
        </div>

        <div class="form-group full">
          <label for="moduleLesson">Module / Lesson</label>
          <select id="moduleLesson" name="moduleLesson">
            <option value="Module 1|Lesson 1">Module 1 - Lesson 1</option>
            <option value="Module 1|Lesson 2">Module 1 - Lesson 2</option>
            <option value="Module 1|Lesson 3">Module 1 - Lesson 3</option>
            <option value="Module 1|Lesson 4">Module 1 - Lesson 4</option>
            <option value="Module 1|Lesson 5">Module 1 - Lesson 5</option>
            <option value="Module 1|Lesson 6">Module 1 - Lesson 6</option>
            <option value="Module 2|Lesson 1">Module 2 - Lesson 1</option>
            <option value="Module 2|Lesson 2">Module 2 - Lesson 2</option>
            <option value="Module 2|Lesson 3">Module 2 - Lesson 3</option>
            <option value="Module 2|Lesson 4">Module 2 - Lesson 4</option>
            <option value="Module 2|Lesson 5">Module 2 - Lesson 5</option>
            <option value="Module 2|Lesson 6">Module 2 - Lesson 6</option>
            <option value="Module 3|Lesson 1">Module 3 - Lesson 1</option>
            <option value="Module 3|Lesson 2">Module 3 - Lesson 2</option>
            <option value="Module 3|Lesson 3">Module 3 - Lesson 3</option>
            <option value="Module 3|Lesson 4">Module 3 - Lesson 4</option>
            <option value="Module 3|Lesson 5">Module 3 - Lesson 5</option>
            <option value="Module 3|Lesson 6">Module 3 - Lesson 6</option>
            <option value="Module 4|Lesson 1">Module 4 - Lesson 1</option>
            <option value="Module 4|Lesson 2">Module 4 - Lesson 2</option>
            <option value="Module 4|Lesson 3">Module 4 - Lesson 3</option>
            <option value="Module 4|Lesson 4">Module 4 - Lesson 4</option>
            <option value="Module 4|Lesson 5">Module 4 - Lesson 5</option>
            <option value="Module 4|Lesson 6">Module 4 - Lesson 6</option>
          </select>
        </div>

        <div class="form-group">
          <label for="potentialMentor">Potential Mentor</label>
          <select id="potentialMentor" name="potentialMentor">
            <option value="No">No</option>
            <option value="Yes">Yes</option>
          </select>
        </div>

        <div class="form-group">
          <label for="c2s101">C2S 101</label>
          <select id="c2s101" name="c2s101">
            <option value="Lesson 1">Lesson 1</option>
            <option value="Lesson 2">Lesson 2</option>
            <option value="Lesson 3">Lesson 3</option>
            <option value="Lesson 4">Lesson 4</option>
            <option value="Lesson 5">Lesson 5</option>
            <option value="Completed">Completed</option>
          </select>
        </div>

        <div class="form-group full">
          <label for="otherTrainings">Other Trainings</label>
          <input type="text" id="otherTrainings" name="otherTrainings" placeholder="e.g. ASP, Revamp">
        </div>

        <div class="form-group full">
          <label for="remarks">Remarks</label>
          <textarea id="remarks" name="remarks" rows="4" placeholder="Additional notes..."></textarea>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save Mentee</button>
          <a href="index.html" class="btn btn-outline">Cancel</a>
        </div>
      </div>
    </form>
  </main>

  <footer class="footer">C2S Mentee Management System &middot; Frontend Prototype</footer>

  <script src="assets/app.js"></script>
</body>
</html>
