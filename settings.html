<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - C2S Mentee Management</title>
  <script>
    if (!localStorage.getItem('c2s_session')) {
      window.location.replace('login.html');
    }
  </script>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="index.html" class="brand">
        <span class="brand-logo">C2</span>
        <span>C2S Mentee Management</span>
      </a>
      <div class="topbar-actions">
        <nav class="topbar-nav">
          <a href="settings.html" class="active">Settings</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="flashMessage"></div>

    <div class="page-header">
      <h1>Settings</h1>
    </div>

    <div class="settings-card">
      <h2>Appearance</h2>
      <p class="desc">Customize how the application looks.</p>

      <div class="setting-row">
        <div class="setting-info">
          <h4>Dark Mode</h4>
          <p>Switch between light and dark theme.</p>
        </div>
        <label class="switch">
          <input type="checkbox" id="darkModeToggle">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="settings-card" id="accountCard">
      <h2>Account Information</h2>
      <p class="desc">Update your full name, gender, Worker ID, or password.</p>

      <form id="accountForm" class="form-grid" style="margin-top:8px;">
        <div class="form-group">
          <label for="acctName">Full Name</label>
          <input type="text" id="acctName" autocomplete="name">
        </div>
        <div class="form-group">
          <label for="acctGender">Gender</label>
          <select id="acctGender">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>
        <div class="form-group">
          <label for="acctWorkerID">Worker ID</label>
          <input type="text" id="acctWorkerID" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="acctCurrentPass">Current Password</label>
          <input type="password" id="acctCurrentPass" placeholder="Required to save changes" autocomplete="current-password">
        </div>
        <div class="form-group">
          <label for="acctNewPass">New Password</label>
          <input type="password" id="acctNewPass" placeholder="Leave blank to keep current" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="acctConfirmPass">Confirm New Password</label>
          <input type="password" id="acctConfirmPass" placeholder="Re-enter new password" autocomplete="new-password">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </main>

  <footer class="footer">C2S Mentee Management System &middot; Frontend Prototype</footer>

  <script src="assets/app.js"></script>
</body>
</html>
