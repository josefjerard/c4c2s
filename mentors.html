<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mentors - C2S Mentee Management</title>
  <script>
    if (!sessionStorage.getItem('c2s_session')) {
      window.location.replace('login.html');
    }
  </script>
  <script>
    try {
      var _s = JSON.parse(sessionStorage.getItem('c2s_session') || 'null');
      if (_s && _s.workerID) {
        var _t = localStorage.getItem('c2s_theme_' + _s.workerID);
        if (_t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (_e) {}
  </script>
  <link rel="icon" type="image/png" href="images/c2s.png?v=2">
  <link rel="stylesheet" href="assets/style.css?v=3">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="admin.html" class="brand">
        <span class="brand-logo"><img src="images/c2s.png?v=2" alt="C2S"></span>
        <span>Admin</span>
      </a>
      <div class="topbar-actions"></div>
    </div>
  </header>

  <main class="container">
    <div id="flashMessage"></div>

    <div class="hero">
      <h1 id="mentorListTitle">Mentors</h1>
      <p id="mentorListSubtitle"></p>
    </div>

    <div class="toolbar" style="justify-content:flex-start;">
      <div class="toolbar-right" style="width:40%;max-width:320px;">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="mentorSearchInput" placeholder="Search mentor names...">
        </div>
      </div>
    </div>

    <div class="admin-container" id="adminTableContainer"></div>
  </main>

  <footer class="footer">C2S Mentee Management System &middot; Mentors</footer>

  <script>
    window.MENTORS_MODE = true;
  </script>
  <script src="assets/app.js?v=7"></script>
</body>
</html>
