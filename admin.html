<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C2S Admin Dashboard</title>
  <script>
    if (!sessionStorage.getItem('c2s_session')) {
      window.location.replace('login.html');
    }
  </script>
  <script>
    try {
      var _s = JSON.parse(sessionStorage.getItem('c2s_session') || 'null');
      if (_s && _s.workerID) {
        var _t = localStorage.getItem('c2s_theme_' + _s.workerID);
        if (_t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (_e) {}
  </script>
  <link rel="icon" type="image/png" href="images/c2s.png">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="admin.html" class="brand">
        <span class="brand-logo"><img src="images/c2s.png" alt="C2S"></span>
        <span>C2S Admin</span>
      </a>
      <div class="topbar-actions"></div>
    </div>
  </header>

  <main class="container">
    <div id="flashMessage"></div>

    <div class="hero">
      <h1>Admin Overview</h1>
    </div>

    <section class="stats" id="adminStats"></section>

    <div class="page-header" style="margin-top:8px;">
      <h1 style="font-size:1.2rem;">Mentors List</h1>
    </div>

    <div class="admin-container" id="adminGenderContainer"></div>
  </main>

  <footer class="footer">C2S Admin System &middot; Admin Dashboard</footer>

  <script>
    window.ADMIN_MODE = true;
  </script>
  <script src="assets/app.js"></script>
</body>
</html>
