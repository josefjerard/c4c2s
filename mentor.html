<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mentors - C2S Mentee Management</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="index.html" class="brand">
        <span class="brand-logo">C2</span>
        <span>C2S Mentee Management</span>
      </a>
      <nav class="topbar-nav">
        <a href="index.html">Dashboard</a>
        <a href="mentor.html" class="active">Mentors</a>
        <a href="settings.html">Settings</a>
      </nav>
      <div class="topbar-actions">
        <button class="theme-toggle" id="themeToggle" title="Toggle dark mode" aria-label="Toggle dark mode">
          <span class="theme-icon">🌙</span>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="flashMessage"></div>

    <div class="hero">
      <h1>Mentors</h1>
      <p>Browse mentor accounts and their assigned mentees (from <code>data/mentors.csv</code>).</p>
    </div>

    <div class="toolbar">
      <div class="toolbar-left">
        <div class="search-box" style="min-width:260px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="mentorSearch" placeholder="Search mentors...">
        </div>
      </div>
    </div>

    <div class="table-wrap" id="mentorTableContainer"></div>

    <div id="mentorDetail" style="display:none;"></div>
  </main>

  <footer class="footer">C2S Mentee Management System &middot; Frontend Prototype</footer>

  <script src="assets/app.js"></script>
</body>
</html>
